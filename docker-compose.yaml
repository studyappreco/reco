

services:
  postgres:
    image: postgres:16
    container_name: postgres-reco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  llm:
    image: ollama/ollama:latest
    container_name: llm-reco
    ports:
      - "11434:11434"

volumes:
  postgres_data: