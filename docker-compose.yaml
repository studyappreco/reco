
services:
  postgres:
    image: postgres:16
    container_name: postgres-reco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  llm:
    image: ollama/ollama:latest
    container_name: llm-reco
    ports:
      - "11434:11434"
  
  baml:
    read_only: true
    container_name: baml-reco
    build:
      context: ./api
      dockerfile: Dockerfile.baml
    ports:
      - "2024:2024"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://0.0.0.0:2024/_debug/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - baml-client:/app/baml_client
    depends_on:
      - llm
      - postgres

volumes:
  postgres_data:
  baml-client: