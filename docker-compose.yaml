
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reco-net
  
  llm:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    networks:
      - reco-net
  
  baml:
    read_only: true
    build:
      context: ./api
      dockerfile: Dockerfile.baml
    ports:
      - "2024:2024"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://0.0.0.0:2024/_debug/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - baml-client:/app/baml_client
    depends_on:
      - llm
      - postgres
    networks:
      - reco-net

volumes:
  postgres_data:
  baml-client:

networks:
  reco-net:
    driver: bridge